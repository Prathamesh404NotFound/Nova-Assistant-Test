<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Nova focused">
  <defs>
    <radialGradient id="g_focused" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.03"/>
    </radialGradient>
    <filter id="g_focused-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ambient halo -->
  <circle cx="120" cy="112" r="100" fill="url(#g_focused)"/>

  <!-- Antenna -->
  <line x1="120" y1="34" x2="120" y2="18" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <circle cx="120" cy="14" r="6" fill="#93c5fd" filter="url(#g_focused-glow)"/>

  <!-- Head shell -->
  <rect x="48" y="34" width="144" height="150" rx="52" fill="#0b1929" stroke="#60a5fa" stroke-width="3" stroke-opacity="0.85" filter="url(#g_focused-glow)"/>
  <rect x="60" y="46" width="120" height="126" rx="42" fill="none" stroke="#60a5fa" stroke-width="1.2" stroke-opacity="0.25"/>

  <!-- Side audio ports -->
  <rect x="38" y="92" width="9" height="26" rx="4.5" fill="#60a5fa" opacity="0.55"/>
  <rect x="193" y="92" width="9" height="26" rx="4.5" fill="#60a5fa" opacity="0.55"/>

  <!-- Eyes -->
  <ellipse cx="90" cy="98" rx="10" ry="8" fill="#60a5fa"/>
  <ellipse cx="150" cy="98" rx="10" ry="8" fill="#60a5fa"/>
  <circle cx="93" cy="95" r="2.6" fill="#ffffff" opacity="0.75"/>
  <circle cx="153" cy="95" r="2.6" fill="#ffffff" opacity="0.75"/>
  <rect x="76" y="84" width="28" height="7" rx="8" fill="#0b1929"/>
  <rect x="136" y="84" width="28" height="7" rx="8" fill="#0b1929"/>

  <!-- Mouth -->
  <line x1="102" y1="140" x2="138" y2="140" stroke="#60a5fa" stroke-width="4.5" stroke-linecap="round"/>

  
</svg>
